[pytest]
# pins collection to tests/ only
# without it, pytest from the root also walks claude_output/claude_tests/, which
# holds files named test_api.py, test_recommender.py and conftest.py
testpaths = tests

# places the project root on sys.path so tests can import main, recommender, and db
pythonpath = .

addopts = -q --strict-markers

filterwarnings =
    ignore::DeprecationWarning
