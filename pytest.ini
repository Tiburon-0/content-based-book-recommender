[pytest]
# pins collection to tests/ only
# without it, pytest from the root also walks claude_output/claude_tests/, which
# holds files named test_api.py, test_recommender.py and conftest.py
# those match default discovery, so a bare `pytest` was reporting on claude drafts
testpaths = tests

# puts the project root on sys.path so tests can import main, recommender and db
pythonpath = .

addopts = -q --strict-markers

filterwarnings =
    # streamlit and botocore noise, not ours to fix
    ignore::DeprecationWarning
